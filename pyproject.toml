[project]
name = "vex-server"
version = "0.1.0"
description = "A FastAPI-based VEX display service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "markdown>=3.8.2",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "uvicorn[standard]>=0.32.0",
    "vex-reader==0.9.5.1",
    "vulncheck-sdk>=0.0.50",
]

[tool.uv]
package = false
# vex-reader pins requests==2.32.4; vulncheck-sdk pins requests==2.32.5
override-dependencies = ["requests>=2.32.5"]
